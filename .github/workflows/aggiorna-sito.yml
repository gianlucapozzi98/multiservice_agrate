# Rigenera il sito (public/) quando cambiano contenuti o foto, per esempio dopo un
# salvataggio dal pannello Pages CMS, e salva il risultato nel repository.
# Vercel pubblica poi la cartella public/ come sempre.
name: Aggiorna il sito

on:
  push:
    branches: [main]
    paths:
      - "contenuti/**"
      - "foto/**"
      - "src/**"
      - "build.py"
      - ".github/workflows/aggiorna-sito.yml"
  workflow_dispatch:

permissions:
  contents: write

# Se arrivano più salvataggi di seguito, basta generare il sito una volta con l'ultimo
concurrency:
  group: aggiorna-sito-${{ github.ref }}
  cancel-in-progress: true

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa Pillow (conversione foto in WebP)
        run: python -m pip install --disable-pip-version-check --quiet pillow==12.3.0

      - name: Genera e salva il sito
        env:
          RAMO: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativo in 1 2 3; do
            python build.py
            git add -A public src/immagini.json src/pagine-date.json
            if git diff --cached --quiet; then
              echo "Il sito è già aggiornato."
              exit 0
            fi
            git commit --quiet -m "Sito aggiornato dopo le modifiche ai contenuti"
            if git push --quiet origin "HEAD:$RAMO"; then
              echo "Sito aggiornato."
              exit 0
            fi
            echo "Nel frattempo è arrivata un'altra modifica: riparto dall'ultima versione."
            git fetch --quiet origin "$RAMO"
            git reset --quiet --hard "origin/$RAMO"
          done
          echo "Non sono riuscito a salvare il sito dopo 3 tentativi."
          exit 1
