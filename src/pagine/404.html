<section class="non-trovata">
  <div class="contenitore contenitore--stretto">
    <p class="non-trovata__codice quota" aria-hidden="true">Errore 404</p>
    <h1 data-righe>Questa parete non esiste. Torniamo al cantiere?</h1>
    <p class="intro">La pagina è stata spostata o l'indirizzo è sbagliato. Puoi ripartire dalla home, guardare i lavori o chiamarci.</p>
    <div class="azioni">
      {{> btn Torna alla home | / | primario }}
      {{> btn Lavori realizzati | /lavori/ | secondario }}
      <a class="link" href="tel:{{ telefono_href }}">{{ telefono }}</a>
    </div>
  </div>
</section>
