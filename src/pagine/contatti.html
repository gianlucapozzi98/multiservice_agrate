<section class="sezione sezione--stretta" id="preventivo" aria-labelledby="contatti-title">
  <div class="contenitore contatto">
    <div class="contatto__intro">
      <h2 id="contatti-title" data-righe>Recapiti e orari.</h2>
      {{> contatti_lista }}
      <p class="contatto__legale quota">{{ ragione_sociale }} · Sede legale: {{ sede_legale }} · P.IVA {{ partita_iva }}</p>
    </div>
    {{> form }}
  </div>
</section>

<section class="sezione sezione--intonaco" aria-labelledby="dove-title">
  <div class="contenitore">
    <div class="sezione__testa sezione__testa--riga">
      <h2 id="dove-title" data-righe>Dove siamo.</h2>
      <a class="link" href="{{ google_maps }}" target="_blank" rel="noopener noreferrer">Indicazioni stradali</a>
    </div>
    {{> mappa }}
  </div>
</section>
